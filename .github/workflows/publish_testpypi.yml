name: Publish Python 🐍 to TestPyPI

on:
  push:
    tags:
      - '*'  # Trigger on any tag push
  workflow_dispatch:

jobs:

  run-tests:
    name: Run Tests
    uses: ./.github/workflows/test_package.yml
    secrets: inherit

  build:
    name: Build Distribution 📦
    runs-on: ubuntu-latest
    needs: run-tests
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install pybada manually
        # Keep this if your build/test requires the pybada package
        run: |
          python -m pip install --upgrade pip
          pip install pybada --ignore-requires-python --no-deps

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI 🐍
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Verify upload (optional)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://test.pypi.org/simple/ pyneats
