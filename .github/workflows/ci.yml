# Continuous Integration - Test, Lint, Type Check
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================
  # LINT & TYPE CHECK (Fast - runs first)
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff linter
        run: uv run ruff check --output-format=github .

      - name: Run Ruff formatter check
        run: uv run ruff format --check .

      - name: Run mypy
        run: uv run mypy src/pyneats/

  # ============================================
  # TEST (Matrix across Python versions)
  # ============================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint  # Only run if lint passes
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      # Skip BADA checkout for Dependabot PRs (no access to secrets)
      - name: Checkout BADA data repo
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@v4
        with:
          repository: eurocontrol-asu/bada-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: bada_data

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --dev
          uv run pip install pybada --no-deps --ignore-requires-python
          uv run pip install git+https://github.com/dlr-pa/oac.git

      - name: Run tests with coverage
        env:
          BADA_ROOT_PATH: ${{ github.workspace }}/bada_data
        run: |
          # For Dependabot PRs, skip BADA tests (no data available)
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            uv run pytest tests/ \
              -m "not requires_bada" \
              --cov=src \
              --cov-report=xml \
              --cov-report=term-missing \
              --junitxml=junit.xml
          else
            uv run pytest tests/ \
              --cov=src \
              --cov-report=xml \
              --cov-report=term-missing \
              --junitxml=junit.xml
          fi

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit.xml

  # ============================================
  # BUILD CHECK (Verify package builds)
  # ============================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version detection

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: uv build

      - name: Check package
        run: |
          uv run --with twine twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ============================================
  # SECURITY AUDIT
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run pip-audit
        run: uv run pip-audit --skip-editable
        continue-on-error: true
