[build-system]
requires = ["setuptools>=70", "wheel", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pyneats"
description = "NEATS: aviation non-CO₂ climate metrics pipeline (PyNeats)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Philippe VERY", email = "philippe.very@eruocontrol.int" }]
keywords = ["aviation", "climate", "contrails", "metrics", "pipeline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Development Status :: 3 - Alpha",
  "Typing :: Typed",
]

# Runtime deps (example — adjust to your real ones)
dependencies = [
  "xarray>=2023.10.1",
  "typer>=0.9",            # if you add a CLI
  "pycontrails[complete]==0.54.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-requests",
]

bada = []  # left empty intentionally; docs explain manual install

[project.scripts]
# If you add a CLI entry point in src/pyneats/cli/main.py
pyneats = "pyneats.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
# If you want to auto-include subpackages under pyneats/*

[tool.setuptools.package-data]
# Package small data files shipped inside the wheel (optional)
# Adjust globs as needed:
pyneats = ["py.typed", "resources/**/*"]

[tool.setuptools.include-package-data]
# If using MANIFEST.in (you may skip MANIFEST.in if the above covers it)
true

[tool.setuptools_scm]
version_file = "src/pyneats/_version.py"
fallback_version = "0.0.0-dev"   # optional safety net

# --- Tooling (recommended but optional) ---

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
strict = true
ignore_missing_imports = true
