# git-cliff configuration for automated changelog generation
# Usage:
#   git cliff --latest           # Show latest release
#   git cliff --output CHANGELOG.md   # Generate full changelog
#   git cliff --unreleased       # Show unreleased changes

[changelog]
header = """
# Changelog

All notable changes to PyNeats will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""

footer = """
<!-- generated by git-cliff -->
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "🚀 Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "♻️ Refactoring" },
  { message = "^doc", group = "📚 Documentation" },
  { message = "^test", group = "🧪 Testing" },
  { message = "^build", group = "🏗️ Build" },
  { message = "^ci", group = "👷 CI/CD" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore", group = "🔧 Miscellaneous" },
  { body = ".*security", group = "🔒 Security" },
]

protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = "v0.0.1-beta"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "eurocontrol-asu"
repo = "PyNeats"
