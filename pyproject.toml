[build-system]
requires = ["setuptools>=70", "wheel", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pyneats"
description = "NEATS: aviation non-CO₂ climate metrics pipeline (PyNeats)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Philippe VERY", email = "philippe.very@eurocontrol.int" }, 
           { name = "Ramon DALMAU", email = "ramon.dalmau-codina@eurocontrol.int" }, 
           { name = "Ana-Maria PELIN", email = "ana-maria.pelin.ext@eurocontrol.int" },
           {name = "Gabriel JARRY", email = "gabriel.jarry@eurocontrol.int"}]


keywords = ["aviation", "climate", "contrails", "metrics", "pipeline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Development Status :: 3 - Alpha",
  "Typing :: Typed",
]

dynamic = ["version"]

dependencies = [
  "xarray==2024.10.0",
  "pycontrails[ecmwf,gcp,gfs,jupyter,pyproj]==0.60.1",
  "dacite>=1.9.2",
  "zarr>=2.18.3,<3",
  "scipy>=1.11.0,<1.17.0",
  "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff>=0.5",
  "mypy>=1.10",
]

bada = []  # left empty intentionally; docs explain manual install

accf = ["climaccf @ git+https://github.com/dlr-pa/climaccf.git@018471922764b649ef23285f64919243b68a19b6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyneats = ["py.typed", "resources/**/*"]

[tool.setuptools_scm]
version_file = "src/pyneats/_version.py"
fallback_version = "0.0.0-dev"   # optional safety net
local_scheme = "no-local-version"

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
# addopts = "-q"
filterwarnings = [
    "ignore::Warning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
color_output = true
pretty = true
show_column_numbers = true
strict = true
check_untyped_defs = true
ignore_missing_imports = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
