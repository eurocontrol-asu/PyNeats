[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pyneats"
description = "NEATS: aviation non-CO₂ climate metrics pipeline (PyNeats)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Philippe VERY", email = "philippe.very@eurocontrol.int" }, 
           { name = "Ramon DALMAU", email = "ramon.dalmau-codina@eurocontrol.int" }, 
           { name = "Ana-Maria PELIN", email = "ana-maria.pelin.ext@eurocontrol.int" },
           {name = "Gabriel JARRY", email = "gabriel.jarry@eurocontrol.int"}]


keywords = ["aviation", "climate", "contrails", "metrics", "pipeline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Development Status :: 3 - Alpha",
  "Typing :: Typed",
]

dynamic = ["version"]

dependencies = [
  "xarray==2024.10.0",
  "pycontrails[ecmwf,gcp,gfs,jupyter,pyproj]==0.60.1",
  "dacite>=1.9.2",
  "zarr>=2.18.3,<3",
  "scipy>=1.11.0,<1.17.0",
  "joblib>=1.3.0",
]

[project.optional-dependencies]
# Keep optional-dependencies for backward compatibility
bada = []  # left empty intentionally; docs explain manual install

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.0",
  "pip-audit>=2.6",
]

docs = [
  "mkdocs-material>=9.0",
  "mkdocstrings[python]>=0.24",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/pyneats/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyneats"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::Warning",
]
markers = [
    "requires_bada: tests that require BADA coefficients data",
    "requires_weather: tests that require weather data",
    "slow: tests that take more than 10 seconds to run",
    "integration: integration tests",
    "benchmark: performance benchmark tests",
]

[tool.coverage.run]
source = ["pyneats"]
omit = [
    "*/tests/*",
    "*/_version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
color_output = true
pretty = true
show_column_numbers = true
strict = true
check_untyped_defs = true
ignore_missing_imports = true
warn_no_return = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
files = ["src/pyneats"]
